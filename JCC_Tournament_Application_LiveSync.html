<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCC Basketball - 2026 Season</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .active-tab { border-bottom: 4px solid #f59e0b; color: #f59e0b; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-5"><h1 class="text-3xl font-extrabold uppercase tracking-tighter">JCC Basketball</h1></div>
        <div class="max-w-5xl mx-auto px-4 flex gap-6 text-sm font-bold uppercase tracking-widest overflow-x-auto">
            <button onclick="switchTab('schedule-tab', this)" class="tab-btn pb-3 active-tab">Games</button>
            <button onclick="switchTab('standings-tab', this)" class="tab-btn pb-3 text-slate-400">Standings</button>
            <button onclick="switchTab('rosters-tab', this)" class="tab-btn pb-3 text-slate-400">Rosters</button>
            <button onclick="switchTab('rules-tab', this)" class="tab-btn pb-3 text-slate-400">Rules</button>
            <button onclick="switchTab('sponsors-tab', this)" class="tab-btn pb-3 text-slate-400">Sponsors</button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8">
        <div class="mb-8">
            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Filter by Division</label>
            <select id="divisionSelector" onchange="renderSchedule()" class="w-full md:w-64 p-3 bg-white border border-slate-200 rounded-lg shadow-sm font-bold text-slate-800">
                <option value="Adult">Adult Division</option>
                <option value="Youth">Youth Division</option>
                <option value="Kids">Kids Division</option>
            </select>
        </div>

        <section id="schedule-tab" class="tab-content active">
            <div id="scheduleContainer" class="grid gap-4">Loading schedule...</div>
        </section>
        <section id="standings-tab" class="tab-content"><div class="p-6 bg-white rounded-xl shadow-sm">Standings content...</div></section>
        <section id="rosters-tab" class="tab-content"><div class="p-6 bg-white rounded-xl shadow-sm">Rosters content...</div></section>
        <section id="rules-tab" class="tab-content"><div class="p-6 bg-white rounded-xl shadow-sm">Rules content...</div></section>
        <section id="sponsors-tab" class="tab-content"><div class="p-6 bg-white rounded-xl shadow-sm">Sponsors content...</div></section>
    </main>

    <script>
        let appState = { teams: {}, schedules: [] };

        async function fetchLiveSheetData() {
            const base = `https://docs.google.com/spreadsheets/d/e/2PACX-1vS0PhsykHDq_juUCAayzwirZyoyrBwM72jfet9TkzGHfyiGUfYRohJb4sdtYwb7LsfXRHyOMFK15ZyM/pub?output=csv`;
            const data = await Promise.all([
                (await fetch(`${base}&gid=0`)).text(),
                (await fetch(`${base}&gid=862932346`)).text()
            ]);
            
            Papa.parse(data[0], {header:true}).data.forEach(r => { 
                if(r.TeamID) appState.teams[r.TeamID] = {name: r.TeamName, div: r.Division}; 
            });

            appState.schedules = Papa.parse(data[1], {header:true}).data;
            renderSchedule();
        }

        function renderSchedule() {
            const div = document.getElementById("divisionSelector").value;
            const container = document.getElementById("scheduleContainer");
            
            container.innerHTML = appState.schedules
                .filter(row => appState.teams[row.HomeID]?.div === div || appState.teams[row.AwayID]?.div === div)
                .map(row => `
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center">
                        <div class="flex-1 text-center">
                            <div class="text-xs font-bold text-slate-400 uppercase tracking-widest">${row.Time || 'TBD'}</div>
                            <div class="text-[10px] font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded inline-block mt-1">${row.Court || 'Court 1'}</div>
                        </div>
                        <div class="flex-[3] flex justify-between items-center px-6">
                            <div class="font-bold text-lg text-slate-800">${appState.teams[row.HomeID]?.name || row.Home || row.HomeID}</div>
                            <div class="text-slate-300 font-black italic mx-4">VS</div>
                            <div class="font-bold text-lg text-slate-800">${appState.teams[row.AwayID]?.name || row.Away || row.AwayID}</div>
                        </div>
                    </div>
                `).join("");
        }

        function switchTab(tabId, btnEl) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active-tab'));
            document.getElementById(tabId).classList.add('active');
            btnEl.classList.add('active-tab');
        }

        window.onload = fetchLiveSheetData;
    </script>
</body>
</html>
