<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCC Basketball - 2026 Season Live Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .active-tab { border-bottom: 4px solid #3b82f6; color: #3b82f6; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900">

    <header class="bg-blue-900 text-white shadow-md sticky top-0">
        <div class="max-w-7xl mx-auto px-4 py-4"><h1 class="text-2xl font-black uppercase">JCC Basketball</h1></div>
        <div class="max-w-7xl mx-auto px-4 flex border-t border-blue-800 text-sm">
            <button onclick="switchTab('schedule-tab', this)" class="tab-btn px-4 py-3 active-tab">📅 Games</button>
            <button onclick="switchTab('standings-tab', this)" class="tab-btn px-4 py-3 text-blue-200">📊 Standings</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <section id="schedule-tab" class="tab-content active">
            <table class="w-full bg-white shadow rounded-lg overflow-hidden">
                <thead class="bg-gray-50 text-xs uppercase text-gray-500"><tr><th class="p-3">Home</th><th class="p-3">Away</th></tr></thead>
                <tbody id="scheduleTableBody"></tbody>
            </table>
        </section>
        <section id="standings-tab" class="tab-content">
            <div id="standingsContent" class="bg-white p-4 shadow rounded-lg">Standings will appear here...</div>
        </section>
    </main>

    <script>
        let appState = { teams: {}, schedules: [] };

        async function fetchLiveSheetData() {
            const base = `https://docs.google.com/spreadsheets/d/e/2PACX-1vS0PhsykHDq_juUCAayzwirZyoyrBwM72jfet9TkzGHfyiGUfYRohJb4sdtYwb7LsfXRHyOMFK15ZyM/pub?output=csv`;
            const responses = await Promise.all([fetch(`${base}&gid=0`), fetch(`${base}&gid=862932346`)]);
            const data = await Promise.all(responses.map(r => r.text()));
            parseData(data[0], data[1]);
        }

        function parseData(tCSV, sCSV) {
            const teams = Papa.parse(tCSV, {header:true}).data;
            teams.forEach(r => { if(r.TeamID) appState.teams[r.TeamID] = r.TeamName; });

            const schedules = Papa.parse(sCSV, {header:true}).data;
            const tbody = document.getElementById("scheduleTableBody");
            
            // Build table rows
            tbody.innerHTML = schedules.map(row => `
                <tr class="border-t text-center">
                    <td class="p-3 font-bold">${appState.teams[row.HomeID] || row.HomeID}</td>
                    <td class="p-3 font-bold">${appState.teams[row.AwayID] || row.AwayID}</td>
                </tr>
            `).join("");
        }

        function switchTab(tabId, btnEl) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active-tab'));
            document.getElementById(tabId).classList.add('active');
            btnEl.classList.add('active-tab');
        }

        window.onload = fetchLiveSheetData;
    </script>
</body>
</html>
