<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCC Basketball - 2026 Season Live Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .active-tab { border-bottom: 4px solid #3b82f6; color: #3b82f6; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900">

    <header class="bg-blue-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <h1 class="text-2xl font-black uppercase">JCC Basketball</h1>
            <div id="syncStatus" class="text-xs text-blue-300">Initializing...</div>
        </div>
        <div class="max-w-7xl mx-auto px-4 flex border-t border-blue-800 text-sm">
            <button onclick="switchTab('schedule-tab', this)" class="tab-btn px-4 py-3 active-tab">📅 Games</button>
            <button onclick="switchTab('standings-tab', this)" class="tab-btn px-4 py-3 text-blue-200">📊 Standings</button>
            <button onclick="switchTab('rosters-tab', this)" class="tab-btn px-4 py-3 text-blue-200">👥 Rosters</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <section id="schedule-tab" class="tab-content active"><div id="scheduleTableBody" class="bg-white p-4"></div></section>
        <section id="standings-tab" class="tab-content"><div id="standingsTableBody" class="bg-white p-4"></div></section>
        <section id="rosters-tab" class="tab-content"><div id="rostersContainer" class="bg-white p-4"></div></section>
    </main>

    <script>
        let appState = { teams: {}, schedules: [], rosters: {} };

        async function fetchLiveSheetData() {
            const base = `https://docs.google.com/spreadsheets/d/e/2PACX-1vS0PhsykHDq_juUCAayzwirZyoyrBwM72jfet9TkzGHfyiGUfYRohJb4sdtYwb7LsfXRHyOMFK15ZyM/pub?output=csv`;
            const urls = [`${base}&gid=0`, `${base}&gid=862932346`, `${base}&gid=1073182645`];

            try {
                const res = await Promise.all(urls.map(url => fetch(url)));
                const data = await Promise.all(res.map(r => r.text()));
                parseTournamentDatabase(data[0], data[1], data[2]);
            } catch (err) { document.getElementById("syncStatus").innerText = "Sync Error"; }
        }

        function parseTournamentDatabase(tCSV, sCSV, rCSV) {
            // 1. Parse Teams using your specific headers: Division, TeamID, TeamName
            const teamsData = Papa.parse(tCSV, { header: true }).data;
            teamsData.forEach(row => {
                if (row.TeamID) {
                    appState.teams[row.TeamID] = row.TeamName;
                }
            });

            // 2. Simple Render Logic
            const body = document.getElementById("scheduleTableBody");
            body.innerHTML = "<pre>" + JSON.stringify(appState.teams, null, 2) + "</pre>";
            document.getElementById("syncStatus").innerText = "Synced Successfully";
        }

        function switchTab(tabId, btnEl) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active-tab'));
            document.getElementById(tabId).classList.add('active');
            btnEl.classList.add('active-tab');
        }

        window.onload = fetchLiveSheetData;
    </script>
</body>
</html>
