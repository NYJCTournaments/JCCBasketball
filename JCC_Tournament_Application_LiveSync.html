<script>
    let appState = { schedules: [], standings: {} };

    async function fetchLiveSheetData() {
        const statusEl = document.getElementById("syncStatus");
        try {
            const base = `https://docs.google.com/spreadsheets/d/e/2PACX-1vS0PhsykHDq_juUCAayzwirZyoyrBwM72jfet9TkzGHfyiGUfYRohJb4sdtYwb7LsfXRHyOMFK15ZyM/pub?output=csv`;
            const res = await fetch(`${base}&gid=862932346`);
            const csvText = await res.text();
            
            const parsed = Papa.parse(csvText, {header:true});
            appState.schedules = parsed.data;
            
            calculateStandings();
            statusEl.innerText = "Synced";
            renderSchedule();
            renderStandings(); 
        } catch (err) {
            statusEl.innerText = "Sync Failed";
        }
    }

    function calculateStandings() {
        appState.standings = {};
        appState.schedules.forEach(game => {
            if (!game.HomeScore || !game.AwayScore) return; // Only count games with scores

            const home = game.HomeID;
            const away = game.AwayID;
            const hScore = parseInt(game.HomeScore);
            const aScore = parseInt(game.AwayScore);

            [home, away].forEach(t => { if(!appState.standings[t]) appState.standings[t] = {W:0, L:0}; });

            if (hScore > aScore) { appState.standings[home].W++; appState.standings[away].L++; }
            else if (aScore > hScore) { appState.standings[away].W++; appState.standings[home].L++; }
        });
    }

    function renderStandings() {
        const div = document.getElementById("divisionSelector").value;
        const container = document.getElementById("standings-tab");
        
        // This is a simple display; we can refine the filter to only show teams in the selected division
        container.innerHTML = `
            <div class="bg-white shadow rounded-lg overflow-hidden p-6">
                <table class="w-full text-left">
                    <thead class="text-xs uppercase text-gray-500"><tr><th class="p-3">Team</th><th class="p-3">Wins</th><th class="p-3">Losses</th></tr></thead>
                    <tbody>
                        ${Object.keys(appState.standings).map(team => `
                            <tr class="border-t">
                                <td class="p-3 font-bold">${team}</td>
                                <td class="p-3">${appState.standings[team].W}</td>
                                <td class="p-3">${appState.standings[team].L}</td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            </div>
        `;
    }

    // Keep your existing renderSchedule and switchTab functions below this...
</script>
