<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCC Basketball - 2026 Season</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .active-tab { border-bottom: 4px solid #3b82f6; color: #3b82f6; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900">

    <header class="bg-blue-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="h-16 w-16 bg-white rounded-lg p-1 flex items-center justify-center overflow-hidden">
                    <img src="Logo.jpg" alt="Logo" class="max-h-full max-w-full object-contain" onerror="this.src='https://img.icons8.com/ios-filled/100/3182ce/basketball-hoop.png';">
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-tight uppercase">JCC Basketball</h1>
                    <p class="text-sm font-semibold text-blue-300 uppercase mt-1">2026 Season</p>
                </div>
            </div>
            <div id="syncStatus" class="text-xs bg-blue-800 px-3 py-1.5 rounded-full text-blue-200">Syncing...</div>
        </div>
       <div class="max-w-7xl mx-auto px-4 flex border-t border-blue-800 text-sm overflow-x-auto">
    <button onclick="switchTab('schedule-tab', this)" class="tab-btn px-4 py-3 active-tab">📅 Games</button>
    <button onclick="switchTab('standings-tab', this)" class="tab-btn px-4 py-3 text-blue-200">📊 Standings</button>
    <button onclick="switchTab('rosters-tab', this)" class="tab-btn px-4 py-3 text-blue-200">👥 Rosters</button>
    <button onclick="switchTab('rules-tab', this)" class="tab-btn px-4 py-3 text-blue-200">📜 Rules</button>
    <button onclick="switchTab('sponsors-tab', this)" class="tab-btn px-4 py-3 text-blue-200">🏆 Sponsors</button>
</div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="mb-6 bg-white p-4 rounded-lg shadow-sm border">
            <label class="block font-bold text-xs uppercase mb-2">Filter by Division:</label>
            <select id="divisionSelector" onchange="renderSchedule()" class="w-full p-2 border rounded font-bold">
                <option value="Adult Division">Adult Division</option>
                <option value="Youth Division">Youth Division</option>
                <option value="Kids Division">Kids Division</option>
            </select>
        </div>

        <section id="schedule-tab" class="tab-content active">
            <div class="bg-white shadow rounded-lg overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 text-xs uppercase text-gray-500"><tr><th class="p-3">Time/Court</th><th class="p-3">Home</th><th class="p-3">Away</th></tr></thead>
                    <tbody id="scheduleTableBody"></tbody>
                </table>
            </div>
        </section>
        <section id="standings-tab" class="tab-content"><div class="p-8 bg-white rounded shadow">Standings Content</div></section>
        <section id="rosters-tab" class="tab-content"><div class="p-8 bg-white rounded shadow">Roster Content</div></section>
        <section id="rules-tab" class="tab-content"><div class="p-8 bg-white rounded shadow">Rules Content</div></section>
        <section id="sponsors-tab" class="tab-content"><div class="p-8 bg-white rounded shadow">Sponsors Content</div></section>
    </main>

<script>
    let appState = { schedules: [], standings: {} };

    async function fetchLiveSheetData() {
        const statusEl = document.getElementById("syncStatus");
        try {
            const base = `https://docs.google.com/spreadsheets/d/e/2PACX-1vS0PhsykHDq_juUCAayzwirZyoyrBwM72jfet9TkzGHfyiGUfYRohJb4sdtYwb7LsfXRHyOMFK15ZyM/pub?output=csv`;
            const res = await fetch(`${base}&gid=862932346`);
            const csvText = await res.text();
            
            const parsed = Papa.parse(csvText, {header:true});
            appState.schedules = parsed.data;
            
            processStandings();
            statusEl.innerText = "Synced";
            renderSchedule();
            renderStandings(); 
        } catch (err) {
            console.error(err);
            statusEl.innerText = "Sync Failed";
        }
    }

    function processStandings() {
        appState.standings = {};
        appState.schedules.forEach(game => {
            // Check for valid IDs and numeric scores
            if (game.HomeID && game.AwayID && game.HomeScore !== "" && game.AwayScore !== "") {
                const hScore = parseInt(game.HomeScore) || 0;
                const aScore = parseInt(game.AwayScore) || 0;

                [game.HomeID, game.AwayID].forEach(team => {
                    if (!appState.standings[team]) {
                        appState.standings[team] = { W: 0, L: 0, Pts: 0, Diff: 0 };
                    }
                });

                // Update Home Team
                appState.standings[game.HomeID].Diff += (hScore - aScore);
                if (hScore > aScore) {
                    appState.standings[game.HomeID].W++;
                    appState.standings[game.HomeID].Pts += 2;
                } else {
                    appState.standings[game.HomeID].L++;
                }

                // Update Away Team
                appState.standings[game.AwayID].Diff += (aScore - hScore);
                if (aScore > hScore) {
                    appState.standings[game.AwayID].W++;
                    appState.standings[game.AwayID].Pts += 2;
                } else {
                    appState.standings[game.AwayID].L++;
                }
            }
        });
    }

    function renderStandings() {
        const container = document.getElementById("standings-tab");
        const teams = Object.keys(appState.standings);
        
        container.innerHTML = `
            <div class="bg-white shadow rounded-lg overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 text-xs uppercase text-gray-500">
                        <tr>
                            <th class="p-3">Team</th>
                            <th class="p-3 text-center">Won</th>
                            <th class="p-3 text-center">Lost</th>
                            <th class="p-3 text-center">Win Pts</th>
                            <th class="p-3 text-center">+/-</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y">
                        ${teams.map(team => `
                            <tr class="hover:bg-gray-50">
                                <td class="p-3 font-bold">${team}</td>
                                <td class="p-3 text-center">${appState.standings[team].W}</td>
                                <td class="p-3 text-center">${appState.standings[team].L}</td>
                                <td class="p-3 text-center font-bold text-blue-600">${appState.standings[team].Pts}</td>
                                <td class="p-3 text-center ${appState.standings[team].Diff >= 0 ? 'text-green-600' : 'text-red-600'}">${appState.standings[team].Diff}</td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            </div>
        `;
    }

    // Keep your renderSchedule and other functions exactly as they are
</script>
</body>
</html>
