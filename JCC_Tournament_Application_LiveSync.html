<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCC Basketball - 2026 Season</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .active-tab { border-bottom: 4px solid #3b82f6; color: #3b82f6; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900">

    <header class="bg-blue-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4"><h1 class="text-2xl font-black uppercase">JCC Basketball</h1></div>
        <div class="max-w-7xl mx-auto px-4 flex border-t border-blue-800 text-sm overflow-x-auto">
            <button onclick="switchTab('schedule-tab', this)" class="tab-btn px-4 py-3 active-tab">📅 Games</button>
            <button onclick="switchTab('standings-tab', this)" class="tab-btn px-4 py-3 text-blue-200">📊 Standings</button>
            <button onclick="switchTab('rosters-tab', this)" class="tab-btn px-4 py-3 text-blue-200">👥 Rosters</button>
            <button onclick="switchTab('rules-tab', this)" class="tab-btn px-4 py-3 text-blue-200">📜 Rules</button>
            <button onclick="switchTab('sponsors-tab', this)" class="tab-btn px-4 py-3 text-blue-200">🏆 Sponsors</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="mb-6 bg-white p-4 rounded-lg shadow-sm border flex items-center justify-between">
            <label class="font-bold text-sm uppercase">Select Division:</label>
            <select id="divisionSelector" onchange="renderUI()" class="bg-gray-50 border p-2 rounded text-blue-900 font-bold">
                <option value="Adult">Adult</option>
                <option value="Youth">Youth</option>
                <option value="Kids">Kids</option>
            </select>
        </div>

        <section id="schedule-tab" class="tab-content active">
            <table class="w-full bg-white shadow rounded-lg overflow-hidden">
                <thead class="bg-gray-50 text-xs uppercase text-gray-500">
                    <tr><th class="p-3">Time/Court</th><th class="p-3">Home</th><th class="p-3">Away</th></tr>
                </thead>
                <tbody id="scheduleTableBody"></tbody>
            </table>
        </section>
        <section id="standings-tab" class="tab-content"><div class="p-4 bg-white shadow rounded">Standings data loading...</div></section>
        <section id="rosters-tab" class="tab-content"><div class="p-4 bg-white shadow rounded">Roster data loading...</div></section>
        <section id="rules-tab" class="tab-content"><div class="p-4 bg-white shadow rounded">Tournament Rules Content...</div></section>
        <section id="sponsors-tab" class="tab-content"><div class="p-4 bg-white shadow rounded">Sponsors list...</div></section>
    </main>

    <script>
        let appState = { teams: {}, schedules: [] };

        async function fetchLiveSheetData() {
            const base = `https://docs.google.com/spreadsheets/d/e/2PACX-1vS0PhsykHDq_juUCAayzwirZyoyrBwM72jfet9TkzGHfyiGUfYRohJb4sdtYwb7LsfXRHyOMFK15ZyM/pub?output=csv`;
            const urls = [`${base}&gid=0`, `${base}&gid=862932346`];
            const data = await Promise.all((await Promise.all(urls.map(url => fetch(url)))).map(r => r.text()));
            
            // Map data
            Papa.parse(data[0], {header:true}).data.forEach(r => { if(r.TeamID) appState.teams[r.TeamID] = {name: r.TeamName, div: r.Division}; });
            appState.schedules = Papa.parse(data[1], {header:true}).data;
            renderUI();
        }

        function renderUI() {
            const div = document.getElementById("divisionSelector").value;
            const tbody = document.getElementById("scheduleTableBody");
            
            tbody.innerHTML = appState.schedules
                .filter(row => appState.teams[row.HomeID]?.div === div || appState.teams[row.AwayID]?.div === div)
                .map(row => `
                    <tr class="border-t text-center">
                        <td class="p-3 text-xs text-gray-500">${row.Time || 'TBD'} <br> ${row.Court || 'Court 1'}</td>
                        <td class="p-3 font-bold">${appState.teams[row.HomeID]?.name || row.Home || row.HomeID}</td>
                        <td class="p-3 font-bold">${appState.teams[row.AwayID]?.name || row.Away || row.AwayID}</td>
                    </tr>
                `).join("");
        }

        function switchTab(tabId, btnEl) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active-tab'));
            document.getElementById(tabId).classList.add('active');
            btnEl.classList.add('active-tab');
        }

        window.onload = fetchLiveSheetData;
    </script>
</body>
</html>
